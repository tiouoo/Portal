name: publish/velopack-nightly

on:
  workflow_dispatch:
  schedule:
    - cron: "00 20 * * *"

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-velopack-nightly
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.meta.outputs.should_publish }}
      version_json: ${{ steps.meta.outputs.json }}
      app_version: ${{ steps.meta.outputs.app_version }}
      bundle_version: ${{ steps.meta.outputs.bundle_version }}
      package_base_version: ${{ steps.meta.outputs.package_base_version }}
      commit: ${{ steps.meta.outputs.commit_hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release metadata
        id: meta
        shell: bash
        run: |
          SHOULD_PUBLISH=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            SINCE_TIME=$(date -u -d '24 hours ago' +'%Y-%m-%dT%H:%M:%SZ')
            if [ "$(git log --since="$SINCE_TIME" --oneline | wc -l)" -eq 0 ]; then SHOULD_PUBLISH=false; fi
          fi
          BASE_VERSION=$(tr -d '[:space:]' < ./src/version.txt)
          PACKAGE_BASE_VERSION="$BASE_VERSION"
          if [ "$PACKAGE_BASE_VERSION" = "0.0.0" ]; then PACKAGE_BASE_VERSION="0.0.1"; fi
          START_EPOCH=$(date -u -d "2026-01-01 00:00:00" +%s)
          NOW_EPOCH=$(date -u +%s)
          TOTAL_HOURS=$(( (NOW_EPOCH - START_EPOCH) / 3600 ))
          APP_VERSION="${PACKAGE_BASE_VERSION}-build.${TOTAL_HOURS}.0.${{ github.run_number }}"
          COMMIT_HASH=$(git rev-parse --short=6 HEAD)
          BUILD_TIME=$(TZ='Asia/Shanghai' date -Iseconds)
          FULL_TIMESTAMP=$(TZ='Asia/Shanghai' date +'%Y%m%d%H%M')
          VERSION_TITLE="build-nightly-${APP_VERSION}-${{ github.run_id }}-${COMMIT_HASH}"
          JSON_STRING="{\"type\":\"nightly\",\"build-time\":\"${BUILD_TIME}\",\"action\":\"${{ github.run_id }}\",\"commit\":\"${COMMIT_HASH}\",\"version\":\"${BASE_VERSION}\",\"timestamp\":\"${FULL_TIMESTAMP}\",\"version_title\":\"${VERSION_TITLE}\"}"
          echo "should_publish=${SHOULD_PUBLISH}" >> "$GITHUB_OUTPUT"
          echo "json=${JSON_STRING}" >> "$GITHUB_OUTPUT"
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "bundle_version=1.${TOTAL_HOURS}.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "package_base_version=${PACKAGE_BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "commit_hash=${COMMIT_HASH}" >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.should_publish == 'true'
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            rid: win-x64
            channel: win-x64-nightly
            pack_id: Portal.win.x64
            kind: windows
            arch: x64
          - runner: ubuntu-22.04
            rid: linux-x64
            channel: linux-x64-nightly
            pack_id: Portal.linux.x64
            kind: linux
            arch: x64
          - runner: ubuntu-22.04
            rid: linux-arm64
            channel: linux-arm64-nightly
            pack_id: Portal.linux.arm64
            kind: linux
            arch: arm64
          - runner: macos-latest
            rid: osx-x64
            channel: osx-x64-nightly
            pack_id: Portal.osx.x64
            kind: macos
            arch: x64
          - runner: macos-latest
            rid: osx-arm64
            channel: osx-arm64-nightly
            pack_id: Portal.osx.arm64
            kind: macos
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
      APP_VERSION: ${{ needs.prepare.outputs.app_version }}
      BUNDLE_VERSION: ${{ needs.prepare.outputs.bundle_version }}
      PACKAGE_BASE_VERSION: ${{ needs.prepare.outputs.package_base_version }}
      RID: ${{ matrix.rid }}
      VELOPACK_CHANNEL: ${{ matrix.channel }}
      PACK_ID: ${{ matrix.pack_id }}
      PACKAGE_KIND: ${{ matrix.kind }}
      PUBLIC_ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Write build metadata
        shell: bash
        run: |
          printf '%s' '${{ needs.prepare.outputs.version_json }}' > ./src/version-ci.txt
          printf '%s' 'velopack' > ./src/package-type.txt
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/cache@v4
        with:
          path: Releases
          key: velopack-nightly-${{ matrix.channel }}-${{ needs.prepare.outputs.app_version }}
          restore-keys: |
            velopack-nightly-${{ matrix.channel }}-
      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install -g vpk --version 1.2.0
      - name: Restore previous package fallback
        shell: bash
        run: |
          mkdir -p Releases
          if ! find Releases -maxdepth 1 -name '*-full.nupkg' -print -quit | grep -q .; then
            PREVIOUS_RUN=$(gh run list --workflow publish-velopack-nightly.yml --status success --limit 10 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$PREVIOUS_RUN" ]; then gh run download "$PREVIOUS_RUN" -n "velopack-${VELOPACK_CHANNEL}" -D Releases || true; fi
          fi
          if ! find Releases -maxdepth 1 -name '*-full.nupkg' -print -quit | grep -q .; then
            vpk download github --repoUrl "https://github.com/${{ github.repository }}" --channel "$VELOPACK_CHANNEL" --outputDir Releases --token "$GH_TOKEN" || true
          fi
      - name: Package application
        shell: pwsh
        run: ./.github/scripts/package-velopack.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: velopack-${{ matrix.channel }}
          path: Releases/*
          retention-days: 30

  publish:
    if: needs.prepare.outputs.should_publish == 'true'
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: Portal.Release
          merge-multiple: true
      - name: Generate changelog
        shell: bash
        run: |
          PREV_COMMIT=$(git rev-parse refs/tags/publish-nightly 2>/dev/null || true)
          if [ -n "$PREV_COMMIT" ]; then RANGE="${PREV_COMMIT}..HEAD"; else RANGE="-20"; fi
          git log --no-merges --pretty='- %s ([%an](${{ github.server_url }}/${{ github.repository }}/commit/%H))' $RANGE > RELEASE_CHANGELOG.md
          if [ ! -s RELEASE_CHANGELOG.md ]; then echo '本次构建与上次相比没有新的提交' > RELEASE_CHANGELOG.md; fi
      - name: Replace moving release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh release delete publish-nightly --cleanup-tag -y || true
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: publish-nightly
          name: build-nightly-${{ needs.prepare.outputs.app_version }}-${{ github.run_id }}-${{ needs.prepare.outputs.commit }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          body_path: RELEASE_CHANGELOG.md
          files: Portal.Release/*
