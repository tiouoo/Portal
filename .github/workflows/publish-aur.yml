name: publish/aur

on:
  workflow_call:
    inputs:
      pkgname:
        required: true
        type: string
      tag:
        required: true
        type: string
      app_version:
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
      AUR_USERNAME:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: pacman -Sy --noconfirm openssh git curl

      - name: Checkout repo (for PKGBUILD template)
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Download AppImage & compute sha256
        run: |
          curl -fL -o Portal.AppImage \
            "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/Portal.linux.x64.AppImage"
          echo "sha=$(sha256sum Portal.AppImage | cut -d' ' -f1)" >> $GITHUB_ENV

      - name: Init / fetch AUR repo
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=no
        run: |
          # 幂等初始化：本地建 master 分支，尝试 fetch 远程。
          # - 远程已有包：fetch 成功后 reset --hard 对齐远端，再走正常更新流程
          # - 远程不存在（首推）：fetch 失败被忽略，本地保留空 init，后续用模板首推
          rm -rf aur
          git init -b master aur
          git -C aur remote add origin "ssh://aur@aur.archlinux.org/${{ inputs.pkgname }}.git"
          if git -C aur fetch origin master 2>/dev/null; then
            git -C aur reset --hard origin/master
            echo "::notice::AUR 仓库已存在，本次为更新"
          else
            echo "::notice::AUR 仓库不存在或为空，本次为首推"
          fi

      - name: Render PKGBUILD
        working-directory: aur
        run: |
          cp "$GITHUB_WORKSPACE/packaging/aur/${{ inputs.pkgname }}.PKGBUILD" PKGBUILD
          sed -i "s|^pkgver=.*|pkgver=${{ inputs.app_version }}|" PKGBUILD
          sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${{ env.sha }}' 'SKIP')|" PKGBUILD
          echo "----- Rendered PKGBUILD -----"
          cat PKGBUILD

      - name: Generate .SRCINFO (non-root)
        working-directory: aur
        run: |
          useradd -m builder
          chown -R builder:builder .
          runuser -u builder -- bash -lc 'makepkg --printsrcinfo > .SRCINFO'

      - name: Commit & push
        working-directory: aur
        env:
          GIT_SSH_COMMAND: ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=no
        run: |
          git config user.name  "${{ secrets.AUR_USERNAME }}"
          git config user.email "actions@github.com"
          git checkout -B master
          git add PKGBUILD .SRCINFO
          # 无变化时退出码非 0，正常跳过
          git commit -m "Update ${{ inputs.pkgname }} to ${{ inputs.app_version }}" || exit 0
          # 首推用 -u 建立跟踪；已跟踪时 -u 无副作用
          git push -u origin master
