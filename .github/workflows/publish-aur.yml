name: publish/aur

on:
  workflow_call:
    inputs:
      pkgname:
        required: true
        type: string
      tag:
        required: true
        type: string
      app_version:
        required: true
        type: string
      download_base:
        description: "可选的 AppImage 下载基址；默认使用当前 GitHub release 标签"
        required: false
        type: string
        default: ""
      moving_tag:
        description: "标记 release 标签是否为移动标签（commit/nightly），移动标签的 AppImage 校验和无法固定，使用 SKIP"
        required: false
        type: boolean
        default: false
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: true
      AUR_USERNAME:
        required: true

jobs:
  aur:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm openssh git curl
          git config --global safe.directory '*'

      - name: Checkout repo (for PKGBUILD template)
        uses: actions/checkout@v7

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$AUR_KEY" > ~/.ssh/aur
          chmod 600 ~/.ssh/aur
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts
        env:
          AUR_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}

      - name: Download AppImage & compute sha256
        env:
          DOWNLOAD_BASE: ${{ inputs.download_base }}
        run: |
          cd "$GITHUB_WORKSPACE"
          if [ -z "$DOWNLOAD_BASE" ]; then
            DOWNLOAD_BASE="https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}"
          fi
          curl -fL --retry 8 --retry-delay 10 --retry-all-errors -o Portal.AppImage \
            "$DOWNLOAD_BASE/Portal.linux.x64.AppImage"
          if [ "${{ inputs.moving_tag }}" = "false" ]; then
            echo "sha=$(sha256sum Portal.AppImage | cut -d' ' -f1)" >> $GITHUB_ENV
          else
            echo "sha=SKIP" >> $GITHUB_ENV
          fi

      - name: Init / fetch AUR repo
        env:
          GIT_SSH_COMMAND: ssh -4 -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=no
        run: |
          set -e
          cd "$GITHUB_WORKSPACE"
          rm -rf aur
          git init -b master aur
          cd aur
          git remote add origin "ssh://aur@aur.archlinux.org/${{ inputs.pkgname }}.git"
          if git ls-remote --exit-code origin HEAD >/dev/null 2>&1; then
            git fetch origin
            git reset --hard origin/master
          else
            echo "AUR package does not exist yet; the first push will create it"
          fi

      - name: Render PKGBUILD
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/aur"
          cp "$GITHUB_WORKSPACE/packaging/aur/${{ inputs.pkgname }}.PKGBUILD" PKGBUILD
          sed -i "s|^pkgver=.*|pkgver=${{ inputs.app_version }}|" PKGBUILD
          if [ "${{ inputs.moving_tag }}" = "true" ]; then
            sed -i "s|^_appimg=\"Portal.AppImage\"|_appimg=\"Portal-${{ inputs.app_version }}.AppImage\"|" PKGBUILD
          fi
          if [ "${{ inputs.moving_tag }}" = "false" ]; then
            sed -i "s|^sha256sums_x86_64=.*|sha256sums_x86_64=('${{ env.sha }}' 'SKIP')|" PKGBUILD
          fi

      - name: Generate .SRCINFO (non-root)
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/aur"
          useradd -m -s /bin/bash builder 2>/dev/null || true
          chown -R builder:builder .
          runuser -u builder -- bash -lc 'cd "$1" && makepkg --printsrcinfo > .SRCINFO' -- "$(pwd)"
          chown -R root:root .

      - name: Commit & push
        env:
          GIT_SSH_COMMAND: ssh -4 -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=no
        run: |
          set -e
          cd "$GITHUB_WORKSPACE/aur"
          git config user.name  "${{ secrets.AUR_USERNAME }}"
          git config user.email "actions@github.com"
          git checkout -B master
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "No AUR package changes to publish"
            exit 0
          fi
          git commit -m "Update ${{ inputs.pkgname }} to ${{ inputs.app_version }}"
          git push -u origin master
